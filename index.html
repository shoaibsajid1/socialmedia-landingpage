<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoaib Sajid</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2DhKNfUl4L2w6gEJvCz5mHhJ/p4Dvn+qA1XyzvmNDRy1Bj+5w3iM4b6l1y3aO3r1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Reset and base styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Arial', sans-serif; transition: background-color 0.3s, color 0.3s; }
    
    body.light { background-color: #fff; color: #222; }
    body.dark { background-color: #121212; color: #eee; }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 { font-size: 3rem; margin-bottom: 0.5em; }
    
    /* Spam-protected email button */
    .email-button {
      font-size: 1.2rem;
      padding: 0.6em 1.2em;
      margin-bottom: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #0078d4;
      color: #fff;
      transition: background-color 0.3s;
    }
    .email-button:hover { background-color: #005ea6; }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 1em;
    }
    .social-links a { font-size: 2rem; color: inherit; transition: transform 0.2s; }
    .social-links a:hover { transform: scale(1.2); }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body class="light">
  <div class="theme-toggle" onclick="toggleTheme()">🌙</div>

  <div class="container">
    <h1>Shoaib Sajid</h1>

    <!-- Clickable email button (spam-protected) -->
    <button class="email-button" onclick="sendMail()">Email Me</button>

    <div class="social-links">
      <a href="https://www.facebook.com/profile.php?id=100089047111192" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com/shoaibsajid1" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/971504288017" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.snapchat.com/add/showeeb" target="_blank"><i class="fab fa-snapchat"></i></a>
      <a href="https://twitter.com/showeeeb" target="_blank"><i class="fab fa-twitter"></i></a>
    </div>
  </div>

  <script>
    // Dark/Light theme toggle
    function toggleTheme() {
      const body = document.body;
      body.classList.toggle('dark');
      body.classList.toggle('light');
      document.querySelector('.theme-toggle').textContent = body.classList.contains('dark') ? '☀️' : '🌙';
    }

    // Spam-protected email
    function sendMail() {
      const user = 'mail';
      const domain = 'shoaibsajid.com';
      window.location.href = `mailto:${user}@${domain}`;
    }
  </script>
</body>
</html>
